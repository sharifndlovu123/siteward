[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webscan"
version = "0.1.0"
description = "Small, self-hostable passive web security scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "django>=5.0",
  "httpx>=0.27",
  "dnspython>=2.6",
  "jinja2>=3.1",
  "typer>=0.12",
  "click>=8.2",   # floor only: CliRunner separates stdout/stderr from 8.2 (tests rely on it)
  "whitenoise>=6.6",
  "gunicorn>=22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.8"]

[project.scripts]
webscan = "webscan.cli.main:app"

[tool.setuptools.packages.find]
include = ["webscan*"]

[tool.setuptools.package-data]
webscan = ["reports/*.j2", "web/templates/**/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
